[project]
name = "sensoryplex-gateway"
version = "0.1.0"
description = "Authenticated metadata query gateway for SensoryPlex"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sensoryplex-api",
]

[tool.uv.sources]
sensoryplex-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensoryplex_gateway"]
