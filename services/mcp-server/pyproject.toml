[project]
name = "sensoryplex-mcp"
version = "0.1.0"
description = "SensoryPlex Model Context Protocol (MCP) Server for AI Assistants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.scripts]
sensoryplex-mcp = "sensoryplex_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensoryplex_mcp"]
