[project]
name = "sensoryplex-relay"
version = "0.1.0"
description = "SensoryPlex outbox relay: transactional outbox to NATS JetStream"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edge-material-sdk",
  "nats-py>=2.9,<3",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
sensoryplex-relay = "sensoryplex_relay.cli:main"

[tool.uv.sources]
edge-material-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensoryplex_relay"]
