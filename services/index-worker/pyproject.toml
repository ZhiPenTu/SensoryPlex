[project]
name = "sensoryplex-index-worker"
version = "0.1.0"
description = "SensoryPlex embedding sink: Milvus upsert/confirm and provenance-checked search"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edge-material-plugin-embed-bge-onnx",
  "edge-material-sdk",
  "grpcio>=1.71,<1.72",
  "psycopg[binary,pool]>=3.2,<4",
  "pymilvus>=2.6,<3",
  "milvus-lite>=2.4",
  # 常驻消费（ADR-025）：nats-py 是本服务自己要 import 的依赖，不从 relay 那边"顺带拿到"。
  "nats-py>=2.9,<3",
  # 事件总线契约（stream / subject / 保留策略 / envelope 对账）只有一份实现，发布端与
  # 消费端都取自 `sensoryplex_relay.contract`——复制常量等于承认两条会各自漂移的事实源。
  "sensoryplex-relay",
]

[project.scripts]
sensoryplex-index = "sensoryplex_index_worker.cli:main"

[tool.uv.sources]
# 检索面把 BGE 插件的 Start 当库调用（ADR-023）：查询向量与索引向量必须同一份模型身份，
# 所以这里**引入插件而不复制它的装配逻辑**。
edge-material-plugin-embed-bge-onnx = { workspace = true }
edge-material-sdk = { workspace = true }
sensoryplex-relay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensoryplex_index_worker"]
