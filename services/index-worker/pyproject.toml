[project]
name = "sensoryplex-index-worker"
version = "0.1.0"
description = "SensoryPlex embedding sink: Milvus upsert/confirm and provenance-checked search"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edge-material-sdk",
  "psycopg[binary,pool]>=3.2,<4",
  "pymilvus>=2.6,<3",
  "milvus-lite>=2.4",
]

[project.scripts]
sensoryplex-index = "sensoryplex_index_worker.cli:main"

[tool.uv.sources]
edge-material-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensoryplex_index_worker"]
