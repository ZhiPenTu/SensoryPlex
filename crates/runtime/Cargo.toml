[package]
name = "sensoryplex-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sensoryplex-sdk.workspace = true
sensoryplex-media.workspace = true
sensoryplex-timeline.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
tonic.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# Local file decoding through GStreamer. It is opt-in so hosts without the GStreamer
# development files still build and test the rest of the workspace.
gstreamer = ["sensoryplex-media/gstreamer"]
