name: sensoryplex
services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: sensoryplex
      POSTGRES_USER: sensoryplex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make configure}
    ports: ["127.0.0.1:${POSTGRES_PORT:-25432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensoryplex -d sensoryplex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.11.3-alpine@sha256:a79a6ff6e42ef41ef964c52bef9fe6eed02fc91cf348801e3dddbbd57636077a
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:${NATS_PORT:-24222}:4222", "127.0.0.1:${NATS_MONITOR_PORT:-28222}:8222"]
    volumes: ["nats-data:/data"]
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    image: ${GATEWAY_IMAGE:-sensoryplex-gateway:0.1.0}
    command: ["/app/.venv/bin/python", "tools/migrate.py"]
    environment:
      SENSORYPLEX_DATABASE_URL: postgresql://sensoryplex:${POSTGRES_PASSWORD}@postgres:5432/sensoryplex
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    image: ${GATEWAY_IMAGE:-sensoryplex-gateway:0.1.0}
    environment:
      SENSORYPLEX_DATABASE_URL: postgresql://sensoryplex:${POSTGRES_PASSWORD}@postgres:5432/sensoryplex
      SENSORYPLEX_API_TOKEN: ${SENSORYPLEX_API_TOKEN:?Run make configure}
      SENSORYPLEX_PRINCIPAL: ${SENSORYPLEX_PRINCIPAL:-local-developer}
      PYTHONPATH: /workspace/services/api/src:/workspace/services/index-worker/src:/workspace/services/outbox-relay/src:/workspace/plugins/python/common/src:/workspace
      # 检索面必须**在这里声明**，不能靠"容器恰好把仓库 `.env` 挂了进来"：`Settings` 的
      # `env_file=".env"` 是按 cwd 找的，gateway 的 working_dir 就是 /workspace，于是它会
      # 顺手读到 bind mount 进来的宿主 `.env`——那样 `semantic_search` 的能力就成了"这个
      # 部署有没有挂载仓库"的函数（ADR-027 §10.3 / §10.4 同一类陷阱）。上一次就是这样：
      # 没有任何声明，capability 却报 true，`tools/smoke_gateway.py` 里"未配置即 503"的
      # 断言当场变红。声明之后 gateway 与 api 的取值来源一致，冒烟也才能按声明断言。
      SENSORYPLEX_INDEX_SEARCH_ENDPOINT: ${SENSORYPLEX_INDEX_SEARCH_ENDPOINT:-}
      SENSORYPLEX_INDEX_SEARCH_TOKEN: ${SENSORYPLEX_INDEX_SEARCH_TOKEN:-}
      SENSORYPLEX_INDEX_VECTOR_INDEX_KEY: ${SENSORYPLEX_INDEX_VECTOR_INDEX_KEY:-material_text_bge_small_zh_v1_5_d512_v1}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
    ports: ["127.0.0.1:${GATEWAY_PORT:-8090}:8090"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    # 注意：api/gateway 服务用 bind mount 把仓库根挂到 /workspace，供 make check / make test /
    # make integration 等开发验证在容器内使用本机源码；不再使用 read_only 根与 cap_drop ALL，
    # 因为开发验证需要写入 .data/.logs/tmp 等路径。
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # 业务/管理/认证 FastAPI 服务：与 gateway 共用同一份 schema 与凭据，
  # 同时独立对外暴露 /livez /v1/health /v1/capabilities 与 /v1 /auth /admin 全量端点。
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: ${API_IMAGE:-sensoryplex-api:0.1.0}
    environment:
      SENSORYPLEX_DATABASE_URL: postgresql://sensoryplex:${POSTGRES_PASSWORD}@postgres:5432/sensoryplex
      SENSORYPLEX_API_TOKEN: ${SENSORYPLEX_API_TOKEN:?Run make configure}
      SENSORYPLEX_PRINCIPAL: ${SENSORYPLEX_PRINCIPAL:-local-developer}
      PYTHONPATH: /workspace/services/api/src:/workspace/services/index-worker/src:/workspace/services/outbox-relay/src:/workspace/plugins/python/common/src:/workspace
      # 语义检索的检索面（ADR-023 / ADR-027）：容器内必须用 compose 服务名（`index:50077`），
      # 不能用 `.env` 里给主机工具用的回环地址——容器里的 127.0.0.1 是它自己。
      # 两个变量都取自 `.env`（`.env.example` 里已给 `index:50077` + 随机令牌）：**都不给**时
      # api 正常启动并把 semantic_search 报成显式不可用（ADR-023 的语义），**只给一个**才拒绝启动。
      # 这里刻意不写死终结点：老 `.env` 由 `make configure` 生成且不会被覆盖，写死会变成
      # "令牌缺失 → api 拒绝启动 → 整个栈起不来"，而沉默的 500 比"显式不可用"难查得多。
      SENSORYPLEX_INDEX_SEARCH_ENDPOINT: ${SENSORYPLEX_INDEX_SEARCH_ENDPOINT:-}
      SENSORYPLEX_INDEX_SEARCH_TOKEN: ${SENSORYPLEX_INDEX_SEARCH_TOKEN:-}
      SENSORYPLEX_INDEX_VECTOR_INDEX_KEY: ${SENSORYPLEX_INDEX_VECTOR_INDEX_KEY:-material_text_bge_small_zh_v1_5_d512_v1}
      # 授权样本挂载点，media-* / handoff-check / model-check / asr-check 在容器内读取。
      HOST_MEDIA_DIR: /host-media
      # 演示账号：让登录页出现「填入演示账号」按钮。
      SENSORYPLEX_DEMO_USERNAME: ${SENSORYPLEX_DEMO_USERNAME:-}
      SENSORYPLEX_DEMO_PASSWORD: ${SENSORYPLEX_DEMO_PASSWORD:-}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
      # 把授权样本目录（默认仓库外 ~/Movies 或 MEDIA_DIR 指向的目录）以只读方式挂进容器；
      # Makefile 里用 /host-media/<filename> 让容器内脚本访问。绝对路径由 .env 的 MEDIA_DIR 控制。
      - type: bind
        source: ${MEDIA_DIR:-/tmp}
        target: /host-media
        read_only: true
    ports: ["127.0.0.1:${API_PORT:-8091}:8091"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # 独立前端 web 容器：nginx 静态托管 apps/console/dist 并把 /v1 /auth /admin 反代到 api:8091，
  # 与 api 服务解耦，避免 SPA 资源把 API 进程拖垮。端口见 CONSOLE_PORT（默认 5173）。
  console:
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
    image: ${CONSOLE_IMAGE:-sensoryplex-console:0.1.0}
    working_dir: /workspace/apps/console
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
      - type: bind
        source: ${REPO_ROOT:-../../}/deploy/compose/console.nginx.conf
        target: /etc/nginx/conf.d/console.conf
        read_only: true
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${CONSOLE_PORT:-5173}:5173"]
    # nginx master 需要 chown 临时目录到 nginx 用户 (uid=101)，保留 CAP_CHOWN；
    # 同时卸掉 NET_RAW/SYS_ADMIN/SYS_PTRACE/ALL 之外的其它 cap，降低被滥用面。
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # 文档站（纯静态，VitePress）：与 console 一样自带 nginx 与 node/npm，但没有反向代理、
  # 不持有任何凭据，也不依赖 api/migrate——所以它没有 depends_on，可以单独起：
  #   ./deploy/up.sh docs
  # 5174 由容器内 nginx 托管构建产物；5175 只在开发期给 `make docs-dev` / `make docs-serve`
  # 的 VitePress dev/preview 用（两者互斥，不能同时占用）。
  docs:
    build:
      context: ../..
      dockerfile: apps/docs/Dockerfile
      # 站点常量在构建期注入。这里**只**注入 DOCS_SITE_URL（设置后产物才带 sitemap 与绝对
      # 地址，留空表示“尚未发布”）；DOCS_BASE 刻意不注入：本机 docs 服务始终按根路径托管，
      # 而 DOCS_BASE 是"产物要被托管在子路径下"的构建期开关，注入它只会让本机站点全 404。
      # 要产出子路径产物请用 `make docs-build DOCS_BASE=/your-prefix/`（见 docs-build 注释）。
      args:
        DOCS_SITE_URL: ${DOCS_SITE_URL:-}
    image: ${DOCS_IMAGE:-sensoryplex-docs:0.1.0}
    working_dir: /workspace/apps/docs
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
    ports:
      - "127.0.0.1:${DOCS_PORT:-5174}:5174"
      - "127.0.0.1:${DOCS_DEV_PORT:-5175}:5175"
    # 与 console 同因：nginx master 需要 chown 临时目录到 nginx 用户 (uid=101)，保留 CAP_CHOWN，
    # 其余 cap 卸掉，降低被滥用面。
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5174/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # ── 事件链路常驻（ADR-024 / ADR-025 / ADR-027）：outbox → JetStream → 消费 → 向量 → 检索面 ──
  # 归在 `events` profile：`./deploy/up.sh` 与 `make up` **不会**拉起它们（默认栈保持轻量），
  # 由 `./deploy/up-events.sh` 显式开启。两个服务与 api 共用同一份镜像与仓库 bind mount：
  # workspace 依赖（sensoryplex-relay / sensoryplex-index-worker）就在这份镜像里。
  relay:
    profiles: ["events"]
    image: ${API_IMAGE:-sensoryplex-api:0.1.0}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    # 每轮认领深度（`--batch`）必须 <= 本档事件链路上限，否则进程按
    # `event_inflight_exceeds_tier_cap` 拒绝启动（ADR-027）；这里两份值都来自 .env。
    command:
      - /app/.venv/bin/python
      - -m
      - sensoryplex_relay.cli
      - --batch
      - ${SENSORYPLEX_EVENT_RELAY_BATCH:-16}
      - --interval-s
      - "1.0"
      - --status-out
      - /workspace/.data/events/relay-status.json
    environment:
      SENSORYPLEX_DATABASE_URL: postgresql://sensoryplex:${POSTGRES_PASSWORD}@postgres:5432/sensoryplex
      SENSORYPLEX_NATS_URL: nats://nats:4222
      # 分级背压（ADR-019 §2/§4）：档位与上限只从 .env 来，进程只读不猜。
      SENSORYPLEX_RESIDENT_TIER: ${SENSORYPLEX_RESIDENT_TIER:-medium}
      SENSORYPLEX_EVENT_QUEUE_CAPACITY: ${SENSORYPLEX_EVENT_QUEUE_CAPACITY:-32}
      PYTHONPATH: /workspace
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
    # 健康 = 状态行还在滚动（每轮都会写一份）：停在那里的 relay 不该被读成"在跑"。
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |-
          import pathlib, time
          path = pathlib.Path("/workspace/.data/events/relay-status.json")
          raise SystemExit(0 if path.is_file() and time.time() - path.stat().st_mtime < 15 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # VLM 慢路径发布器：只搬运 PostgreSQL 的 vlm_task_outbox 到独立 WorkQueue；确认发布前
  # 不改变任务状态。它不读媒体、不运行模型，也不与素材事件流共用 subject。
  vlm-publisher:
    profiles: ["events"]
    image: ${API_IMAGE:-sensoryplex-api:0.1.0}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command:
      - /app/.venv/bin/python
      - -m
      - sensoryplex_api.vlm_slowpath
      - publisher
      - --batch
      - ${SENSORYPLEX_VLM_PUBLISH_BATCH:-64}
      - --status-out
      - /workspace/.data/events/vlm-publisher-status.json
    environment:
      SENSORYPLEX_DATABASE_URL: postgresql://sensoryplex:${POSTGRES_PASSWORD}@postgres:5432/sensoryplex
      SENSORYPLEX_NATS_URL: nats://nats:4222
      PYTHONPATH: /workspace/services/api/src:/workspace/services/index-worker/src:/workspace/services/outbox-relay/src:/workspace/plugins/python/common/src:/workspace
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |-
          import pathlib, time
          path = pathlib.Path("/workspace/.data/events/vlm-publisher-status.json")
          raise SystemExit(0 if path.is_file() and time.time() - path.stat().st_mtime < 15 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # VLM 结果融合器：消费独立 result subject，事务性追加 Observation/Material/outbox 后才 ACK。
  # 不解码媒体；消息重投或结果冲突都不被误记为成功。
  vlm-result-fuser:
    profiles: ["events"]
    image: ${API_IMAGE:-sensoryplex-api:0.1.0}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command:
      - /app/.venv/bin/python
      - -m
      - sensoryplex_api.vlm_slowpath
      - fuser
      - --status-out
      - /workspace/.data/events/vlm-result-fuser-status.json
    environment:
      SENSORYPLEX_DATABASE_URL: postgresql://sensoryplex:${POSTGRES_PASSWORD}@postgres:5432/sensoryplex
      SENSORYPLEX_NATS_URL: nats://nats:4222
      PYTHONPATH: /workspace/services/api/src:/workspace/services/index-worker/src:/workspace/services/outbox-relay/src:/workspace/plugins/python/common/src:/workspace
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |-
          import pathlib, time
          path = pathlib.Path("/workspace/.data/events/vlm-result-fuser-status.json")
          raise SystemExit(0 if path.is_file() and time.time() - path.stat().st_mtime < 15 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # 常驻消费 + 检索面同进程：Milvus Lite 的数据目录是进程独占的（ADR-020 §7），
  # 所以"事件驱动写入的向量"必须由持有向量库的那个进程自己消费出来（ADR-025 §1）。
  index:
    profiles: ["events"]
    image: ${API_IMAGE:-sensoryplex-api:0.1.0}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command:
      - /app/.venv/bin/python
      - -m
      - sensoryplex_index_worker.cli
      - serve
      - --vector-index-key
      - ${SENSORYPLEX_INDEX_VECTOR_INDEX_KEY:-material_text_bge_small_zh_v1_5_d512_v1}
      # 跨容器接入必须显式开端口；令牌由 SENSORYPLEX_INDEX_AUTH_TOKEN 提供（缺失即拒绝启动）。
      - --bind
      - 0.0.0.0
      - --port
      - "50077"
      # BGE 权重随仓库 bind mount 进来（`.data/models/` 被 git 忽略，绝不入库）；
      # 目录缺失时进程按 `model_dir_required` / `model_file_not_found` 显式失败，不联网下载。
      - --model-dir
      - /workspace/.data/models/bge-small-zh-v1.5
      - --model-file
      - onnx/model_quantized.onnx
      - --consume
      - --consume-batch
      - ${SENSORYPLEX_EVENT_CONSUME_BATCH:-32}
      - --consume-status-out
      - /workspace/.data/events/index-status.json
      - --out
      - /workspace/.data/events/index-ready.json
    environment:
      SENSORYPLEX_INDEX_DATABASE_URL: postgresql://sensoryplex:${POSTGRES_PASSWORD}@postgres:5432/sensoryplex
      SENSORYPLEX_NATS_URL: nats://nats:4222
      # 向量库落在仓库 bind mount 下的 `.data/index/`：命名卷的挂载点是 root 所有，而本容器以
      # 非 root 用户运行（写不进去就是 PermissionError 而不是可读的原因码）。`.data/` 已被
      # .gitignore 排除；flock 是进程级的，万一有第二个进程打开同一个文件，它会显式报
      # `vector_store_locked` 而不是两份写入。
      SENSORYPLEX_MILVUS_URI: /workspace/.data/index/milvus.db
      SENSORYPLEX_INDEX_AUTH_TOKEN: ${SENSORYPLEX_INDEX_AUTH_TOKEN:-}
      SENSORYPLEX_RESIDENT_TIER: ${SENSORYPLEX_RESIDENT_TIER:-medium}
      SENSORYPLEX_EVENT_QUEUE_CAPACITY: ${SENSORYPLEX_EVENT_QUEUE_CAPACITY:-32}
      PYTHONPATH: /workspace
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
    # 健康 = 进程活着并已在监听：端口在**编码器与向量库契约之后**才开（模型起不来 / collection
    # 漂移都开不了端口），但**早于**消费侧接上。所以"能连上"只说"检索面就绪"；"消费真的接上了"
    # 的凭据是 ready 行（`--out`，在 `runner.wait_ready` 确认之后才写，见 cli.py）。
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |-
          import socket
          socket.create_connection(("127.0.0.1", 50077), 3).close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  enrichment-publisher:
    profiles: ["events"]
    image: ${API_IMAGE:-sensoryplex-api:0.1.0}
    command: [/app/.venv/bin/python, -m, sensoryplex_api.enrichment_service, publisher]
    environment:
      <<: &enrichment-environment
        SENSORYPLEX_DATABASE_URL: postgresql://sensoryplex:${POSTGRES_PASSWORD}@postgres:5432/sensoryplex
        SENSORYPLEX_NATS_URL: nats://nats:4222
        PYTHONPATH: /workspace/services/api/src:/workspace/plugins/python/common/src:/workspace
      SENSORYPLEX_ENRICHMENT_ROLE: publisher
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${REPO_ROOT:-../../}
        target: /workspace
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
    restart: unless-stopped

    healthcheck: &enrichment-health
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import json,os,pathlib,time;
          value=json.loads(pathlib.Path('/workspace/.data/events/enrichment-'+os.environ['SENSORYPLEX_ENRICHMENT_ROLE']+'-status.json').read_text());
          assert value['state']=='ready' and 0<=time.time()*1000-value['updated_at_unix_ms']<30000
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  enrichment-result-fuser:
    profiles: ["events"]
    image: ${API_IMAGE:-sensoryplex-api:0.1.0}
    command: [/app/.venv/bin/python, -m, sensoryplex_api.enrichment_service, fuser]
    environment:
      <<: *enrichment-environment
      SENSORYPLEX_ENRICHMENT_ROLE: fuser
    working_dir: /workspace
    volumes:
      - type: bind
