# 文档站静态托管（纯静态，不反代任何后端）：
# - VitePress 以 cleanUrls 构建（`/guide/quickstart` ↔ `guide/quickstart.html`），因此
#   fallback 顺序是 `$uri` → `$uri.html` → `$uri/index.html`，未命中一律 `=404`
#   （由 error_page 交给站点自带的 404.html）；**不能用 200 兜底**，否则死链在监控与
#   爬虫眼里都成了“存在”。
# - 多语言靠目录前缀实现（`/zh/...`），nginx 不需要任何语言协商逻辑。
# 注：pid 与 error_log 由 Dockerfile 重定向到 /tmp/nginx.pid 与 /dev/stderr。
server {
    listen 5174 default_server;
    listen [::]:5174 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态站不持有凭据、不接受上传；这里只补齐静态托管的基线头。
    # 注意 add_header 的继承规则：子级 location 只要自己写了 add_header，就会整体替换
    # server 级的那一组，所以下面每个 location 都显式重复一遍。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # 未命中的路径交给 VitePress 自带的 404 页面，并**保留 404 状态码**。
    error_page 404 /404.html;

    # 站点资产（VitePress 以内容哈希命名）：长期缓存，命中不到就是真缺失。
    # `^~` 是必须的：正则 location 会覆盖普通前缀 location，否则 `/assets/` 会被下面的
    # 尾斜杠规则抢走，缓存头也跟着丢。
    location ^~ /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # cleanUrls 的两种写法要落到同一个文件：`/guide/quickstart` 由 `$uri.html` 命中，
    # 而带尾斜杠的 `/guide/quickstart/` 只会被 try_files 拼成 `.../index.html`，所以这里
    # 先把尾斜杠形式显式改写回 `.html` / `index.html` 两种真实形态。
    location ~ ^(.+)/$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $1.html $1/index.html =404;
    }

    location / {
        # 文档要能就地更新：html 不做长缓存，避免读者停在旧版本。
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
