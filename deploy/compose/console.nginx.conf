# 前端 web 容器静态托管 + 反向代理：
# - SPA 入口、/static/* 资产与 history fallback 都由本机提供；
# - /v1 /auth /admin 转发到 api:8091，避免前端跨域；
# - 不缓存 /v1|/auth|/admin，所有其它路径默认按 Vite 资产哈希保持 long-cache。
# 注：pid 与 error_log 通过 Dockerfile sed 重定向到 /tmp/nginx.pid 与 /dev/stderr，
#     以避开容器 read_only 根上无法写 /var/run 与 /var/log/nginx 的限制。
# 注：Docker 内置 DNS 同时返回 A/AAAA，nginx 默认会双栈尝试；为避免 IPv6 路由不通时回退慢，
#     显式 resolver 关闭 IPv6，并复用同一变量完成 proxy_pass。
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 5173 default_server;
    listen [::]:5173 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全头：与 services/api/app.py 的边界保持一致，不在控制平面暴露框架版本。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # API 反向代理：业务、管理、认证三类端点都打 api:8091。
    location ~ ^/(v1|auth|admin)(/|$) {
        set $sensoryplex_api http://api:8091;
        proxy_pass $sensoryplex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 1g;
    }

    # Vite 静态资产：带哈希文件名长期缓存。
    location /static/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # SPA history fallback：前端路由直接落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
