name: engineering-checks
on:
  # 日常验证在本地完成；不因 push 或 PR 自动消耗托管 runner 额度。
  # 只有维护者在 Actions 页面显式选择 Run workflow 时才会运行。
  workflow_dispatch:
    inputs:
      run_apple_silicon:
        description: "运行完整 Apple Silicon / GStreamer 验证（消耗 macOS 额度）"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  # 同一 ref 的重复手动运行只保留最新一次，避免重复消耗额度。
  group: engineering-checks-${{ github.ref }}
  cancel-in-progress: true
# 远端 CI 没有本项目的 compose 栈（ubuntu runner 上没起容器，macOS runner 根本没有
# Docker），所以各 job 都用 EXEC_MODE=host 让 `make <target>` 退回主机命令：
# 同一组步骤、同一份 Makefile，差别只有在哪执行。容器模式仍是本机默认。
env:
  EXEC_MODE: host
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: sensoryplex_test
          POSTGRES_USER: sensoryplex_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sensoryplex_test -d sensoryplex_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SENSORYPLEX_TEST_DATABASE_URL: postgresql://sensoryplex_test:ci-ephemeral-only@localhost:5432/sensoryplex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- plugins/python/common/src/edge_material_sdk/generated
      # make check = lint-ruff + 契约测试 + 集成测试 + Rust fmt/clippy/test；
      # tests/integration 需要 SENSORYPLEX_TEST_DATABASE_URL，由上面的 postgres service 提供。
      - run: make check
      - run: make runtime-smoke
      # 宿主加速器上报（ADR-022）要真读宿主（system_profiler / CoreML framework），
      # 这个 job 是目前唯一能提供"远端 Apple Silicon 真机"证据的地方（开发机之外）。
      # 无头虚拟机上拿不到显示报告时，脚本会显式打印"无法独立对账"，不会静默放宽断言。
      - run: make accelerator-check

  check-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- apps/console/src/api/contracts.ts
      - run: npm --prefix apps/console ci
      - run: npm --prefix apps/console run format:check
      - run: npm --prefix apps/console run build

  check-apple-silicon:
    # macOS 是一等端侧目标（ADR-008）；容器集成测试仍留在 ubuntu，
    # 因为 macOS runner 上的 service container 行为未经本项目验证。只在手动运行时
    # 明确勾选输入才消耗 macOS 额度；日常 macOS 验证由本机完成。
    if: inputs.run_apple_silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 断言 Apple Silicon（ADR-008）
        # macos-15 目前是 macos-15-arm64 镜像；如果哪天换成 x86，这里必须先红，
        # 否则"macOS CI 通过"会悄悄退化成"在 Intel 上通过"。
        run: |
          uname -m
          test "$(uname -m)" = "arm64"
          sysctl -n hw.memsize
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- plugins/python/common/src/edge_material_sdk/generated
      # macOS runner 既没有 Docker 也没有 PostgreSQL，所以这里跑 `make check` 里不需要
      # 数据库的部分（lint + 契约测试），Rust 三条与 check 用同一组命令；集成测试只由
      # ubuntu 的 check job 覆盖。改 check 的步骤时同步这里（Makefile 里也留了同样的提示）。
      - run: make lint-ruff test-contracts
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # GStreamer 只用于编译解码路径；这里不跑 media-replay，因为 CI 没有真实授权媒体。
      - run: brew install gstreamer
      - run: make media-check
      # 解码路径的单元测试（含保留表按种类分配的 A/B 回归）只在带 gstreamer feature 时存在，
      # 不跑这一步等于回归锁没进 CI。make media-test 与容器模式同源（EXEC_MODE=host 展开成
      # 同一条主机 cargo 命令），所以这里用 make 而不是裸 cargo。
      - run: make media-test
      - run: make runtime-smoke
      # 宿主加速器上报（ADR-022）的远端真机证据就在这个 job：它是开发机之外唯一能真跑
      # `system_profiler` / 读到 CoreML framework 的地方（这也是 Mac mini 的同类目标）。
      - run: make accelerator-check
