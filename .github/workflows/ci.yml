name: engineering-checks
on:
  push:
  pull_request:
  # 允许在不制造空提交的前提下重跑：M7 的验收要求"远端真实跑过一次"。
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: sensoryplex_test
          POSTGRES_USER: sensoryplex_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sensoryplex_test -d sensoryplex_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SENSORYPLEX_TEST_DATABASE_URL: postgresql://sensoryplex_test:ci-ephemeral-only@localhost:5432/sensoryplex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- plugins/python/common/src/edge_material_sdk/generated
      - run: make check
      - run: make integration
      - run: make runtime-smoke

  check-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- apps/console/src/api/contracts.ts
      - run: npm --prefix apps/console ci
      - run: npm --prefix apps/console run format:check
      - run: npm --prefix apps/console run build

  check-apple-silicon:
    # macOS 是一等端侧目标（ADR-008）；容器集成测试仍留在 ubuntu，
    # 因为 macOS runner 上的 service container 行为未经本项目验证。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 断言 Apple Silicon（ADR-008）
        # macos-15 目前是 macos-15-arm64 镜像；如果哪天换成 x86，这里必须先红，
        # 否则"macOS CI 通过"会悄悄退化成"在 Intel 上通过"。
        run: |
          uname -m
          test "$(uname -m)" = "arm64"
          sysctl -n hw.memsize
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- plugins/python/common/src/edge_material_sdk/generated
      - run: make check
      # GStreamer 只用于编译解码路径；这里不跑 media-replay，因为 CI 没有真实授权媒体。
      - run: brew install gstreamer
      - run: make media-check
      # 解码路径的单元测试（含保留表按种类分配的 A/B 回归）只在带 gstreamer feature 时存在，
      # 不跑这一步等于回归锁没进 CI。
      # 刻意写 cargo 而不是 make：CI 只依赖仓库已提交的 Makefile，不依赖正在进行中的
      # Makefile 容器化改造（同样命令在主机上也可用 `make media-test`）。
      - run: cargo test --locked -p sensoryplex-media --features gstreamer
      - run: make runtime-smoke
