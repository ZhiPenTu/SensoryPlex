name: engineering-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: sensoryplex_test
          POSTGRES_USER: sensoryplex_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sensoryplex_test -d sensoryplex_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SENSORYPLEX_TEST_DATABASE_URL: postgresql://sensoryplex_test:ci-ephemeral-only@localhost:5432/sensoryplex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- plugins/python/common/src/edge_material_sdk/generated
      - run: make check
      - run: make integration
      - run: make runtime-smoke

  check-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- apps/console/src/api/contracts.ts
      - run: npm --prefix apps/console ci
      - run: npm --prefix apps/console run format:check
      - run: npm --prefix apps/console run build

  check-apple-silicon:
    # macOS 是一等端侧目标（ADR-008）；容器集成测试仍留在 ubuntu，
    # 因为 macOS runner 上的 service container 行为未经本项目验证。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: uv sync --frozen
      - run: make proto
      - run: git diff --exit-code -- plugins/python/common/src/edge_material_sdk/generated
      - run: make check
      # GStreamer 只用于编译解码路径；这里不跑 media-replay，因为 CI 没有真实授权媒体。
      - run: brew install gstreamer
      - run: make media-check
      - run: make runtime-smoke
