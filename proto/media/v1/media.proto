syntax = "proto3";
package edge.material.media.v1;

import "common/v1/common.proto";

// ADR-003: real-time media uses GStreamer, offline tools use FFmpeg. The kind only selects
// the adapter; it never changes timeline semantics.
enum MediaSourceKind {
  MEDIA_SOURCE_KIND_UNSPECIFIED = 0;
  MEDIA_SOURCE_KIND_FILE = 1;
  MEDIA_SOURCE_KIND_SRT = 2;
}

// References a source without carrying the URI or its credentials.
message MediaSourceRef {
  string stream_id = 1;
  string source_id = 2;
  MediaSourceKind kind = 3;
  // Secret name only. The URI itself never enters control messages or logs.
  string uri_secret_ref = 4;
  // sha256 of the local file; empty for live streams, never a placeholder digest.
  string content_hash = 5;
}

message MediaTrack {
  string track_kind = 1; // video | audio
  string codec = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 sample_rate = 5;
  uint32 channels = 6;
  double average_frame_rate = 7;
  // false when the container cannot report timing; such a track cannot feed timeline fusion.
  bool timing_known = 8;
}

message MediaSourceDescription {
  MediaSourceRef source = 1;
  repeated MediaTrack tracks = 2;
  // 0 means unknown (live stream or unreadable container), never an assumed duration.
  int64 duration_ms = 3;
  string probe_tool = 4;
}

// A decoded timeline anchor on one stream. Anchors carry no media bytes.
message TimelineAnchor {
  string anchor_id = 1;
  string track_kind = 2;
  edge.material.common.v1.TimeRange time_range = 3;
  int64 pts_ms = 4;
  bool keyframe = 5;
}

// Per-track decode accounting. Every number here is an observation from the decoder; a track
// that produced nothing stays at zero instead of being given an optimistic default.
message DecodedTrackStat {
  string track_kind = 1; // video | audio
  // Descriptors this track handed off. For video that is the number of *kept* frames once
  // adaptive sampling runs; the observed frame count lives in `SamplingReport.observed`.
  uint64 samples = 2;
  uint64 bytes = 3;
  // -1 means the track never reported a presentation timestamp; never a fabricated zero.
  int64 first_pts_ms = 4;
  // Exclusive end of the last decoded interval on this track; -1 when it could not be
  // observed. Adaptive sampling shortens the handoff, never this value.
  int64 last_end_ms = 5;
  uint32 width = 6;
  uint32 height = 7;
  string pixel_format = 8;
  uint32 sample_rate = 9;
  uint32 channels = 10;
  string audio_format = 11;
  // Frames this track refused. Sampler skips are included here (with their reason in
  // `drop_reasons`), so `samples + dropped_samples` stays the number of decoded samples.
  // The sampling breakdown is a different view of the same skips: never add the two.
  uint64 dropped_samples = 12;
  repeated string drop_reasons = 13;
  // Presentation origin applied to the raw media timestamps, in milliseconds. Non-zero means
  // the container declared an edit list and the descriptor timeline was shifted onto it.
  int64 timeline_offset_ms = 14;
  // Buffers whose interval repeats the previous one, which millisecond rounding can produce at
  // the end of a stream. They are kept, never deleted, and always counted here.
  uint64 overlapping_samples = 15;
  // Handed-off samples whose duration was not carried by the buffer and was derived from the
  // measured PTS gap to the next sample on the same track. Zero means every handed-off sample
  // carried its own duration; it is never a claim that timing metadata was present.
  uint64 duration_derived_samples = 16;
}

// One audio segment cut from decoded PCM. The range covers exactly the samples it carries,
// so a segment is never wider than its own payload.
message AudioSegment {
  string segment_id = 1;
  edge.material.common.v1.TimeRange time_range = 2;
  uint32 sample_rate = 3;
  uint32 channels = 4;
  uint64 bytes = 5;
  // True when the segment is shorter than the configured length because the stream ended.
  bool partial = 6;
}

message AudioSegmentReport {
  uint32 segment_ms = 1;
  uint64 segments = 2;
  uint64 partial_segments = 3;
  uint64 bytes = 4;
  // Bounded preview; `listed_limit` below says how many segments were repeated here.
  repeated AudioSegment listed = 5;
  uint32 listed_limit = 6;
  // Samples the segmenter itself could not place, plus the holes that closed a segment.
  uint64 dropped_samples = 7;
  uint64 discontinuities = 8;
  repeated string drop_reasons = 9;
}

// Adaptive sampling accounting for a video track. Every observed frame is counted exactly
// once, either as a keep (with a reason) or as a skip (with a reason). Keep count is bounded
// by the rate limit, never by luck.
message SamplingReport {
  string track_kind = 1; // video; only video is sampled
  int64 min_interval_ms = 2;
  int64 static_hold_ms = 3;
  uint32 change_threshold = 4;
  // Frames offered to the sampler (usable pts and complete layout). Frames rejected earlier
  // are counted on the track only, never here.
  uint64 observed = 5;
  uint64 kept = 6;
  uint64 kept_first_frame = 7;
  uint64 kept_content_change = 8;
  uint64 kept_static_heartbeat = 9;
  uint64 skipped_rate_limited = 10;
  uint64 skipped_no_change = 11;
  uint64 skipped_non_monotonic = 12;
  uint64 skipped_missing_signature = 13;
  // Longest gap between two keeps; a static stream is bounded by static_hold_ms.
  int64 max_gap_ms = 14;
  // Hard upper bound on keeps given the observed span, derived from the rate limit alone.
  uint64 max_keeps_bound = 15;
  // Largest observed gap between consecutive pts, used to recompute the max_gap_ms bound.
  int64 max_frame_interval_ms = 16;
}

// Real data-plane accounting for one replay. All zeros means this build never decoded.
message DecodedDataPlane {
  string arena_id = 1;
  uint64 arena_capacity_bytes = 2;
  // High-water mark of committed arena space, not concurrent live bytes: the arena is a bump
  // allocator with a free list, so a request too large for any freed region commits new space.
  // A value near `arena_capacity_bytes` means the stream is fragmenting the arena.
  uint64 arena_peak_bytes = 3;
  // Cumulative bytes that flowed through the arena. Not resident, and not a memory bound.
  uint64 decoded_bytes = 4;
  repeated DecodedTrackStat tracks = 5;
  uint64 descriptors_built = 6;
  uint64 descriptors_validated = 7;
  uint64 descriptor_failures = 8;
  repeated string failure_reasons = 9;
  uint64 leases_issued = 10;
  uint64 leases_released = 11;
  // First descriptor verified for each track: handoff-contract evidence, still without bytes.
  repeated edge.material.common.v1.BufferDescriptor evidence_descriptors = 12;
  AudioSegmentReport audio_segments = 13;
  // Sampling accounting when this build really decoded. Empty means no sampling ran here;
  // it must never be read as "every frame was kept".
  repeated SamplingReport sampling = 14;
}

// One replay attempt. Counters and reasons stay explicit instead of optimistic defaults.
message ReplayReport {
  MediaSourceDescription source = 1;
  repeated TimelineAnchor anchors = 2;
  uint64 decoded_items = 3;
  uint64 emitted_anchors = 4;
  uint64 dropped_items = 5;
  uint64 out_of_order_items = 6;
  uint64 gap_items = 7;
  string platform = 8;
  // Capabilities this build did not implement, for example gstreamer_decode_not_implemented.
  repeated string blockers = 9;
  // Why items were dropped. A drop is always explained, never silent.
  repeated string drop_reasons = 10;
  // Stays false unless real authorized media passed the full acceptance path.
  bool golden_path_verified = 11;
  // Populated only when this build actually decoded buffers.
  DecodedDataPlane decoded = 12;
  // Whether this run handed the decoded bytes to an independent consumer process.
  // A plain replay must report "not_exercised": a report must never imply that the
  // lease consumer ran. "exposed_on=<addr>" means the data plane was served there,
  // and the lease accounting lives in that run's `handoff_stats` line.
  string handoff_state = 13;
}
