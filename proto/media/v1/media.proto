syntax = "proto3";
package edge.material.media.v1;

import "common/v1/common.proto";

// ADR-003: real-time media uses GStreamer, offline tools use FFmpeg. The kind only selects
// the adapter; it never changes timeline semantics.
enum MediaSourceKind {
  MEDIA_SOURCE_KIND_UNSPECIFIED = 0;
  MEDIA_SOURCE_KIND_FILE = 1;
  MEDIA_SOURCE_KIND_SRT = 2;
}

// References a source without carrying the URI or its credentials.
message MediaSourceRef {
  string stream_id = 1;
  string source_id = 2;
  MediaSourceKind kind = 3;
  // Secret name only. The URI itself never enters control messages or logs.
  string uri_secret_ref = 4;
  // sha256 of the local file; empty for live streams, never a placeholder digest.
  string content_hash = 5;
}

message MediaTrack {
  string track_kind = 1; // video | audio
  string codec = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 sample_rate = 5;
  uint32 channels = 6;
  double average_frame_rate = 7;
  // false when the container cannot report timing; such a track cannot feed timeline fusion.
  bool timing_known = 8;
}

message MediaSourceDescription {
  MediaSourceRef source = 1;
  repeated MediaTrack tracks = 2;
  // 0 means unknown (live stream or unreadable container), never an assumed duration.
  int64 duration_ms = 3;
  string probe_tool = 4;
}

// A decoded timeline anchor on one stream. Anchors carry no media bytes.
message TimelineAnchor {
  string anchor_id = 1;
  string track_kind = 2;
  edge.material.common.v1.TimeRange time_range = 3;
  int64 pts_ms = 4;
  bool keyframe = 5;
}

// Per-track decode accounting. Every number here is an observation from the decoder; a track
// that produced nothing stays at zero instead of being given an optimistic default.
message DecodedTrackStat {
  string track_kind = 1; // video | audio
  // Descriptors this track handed off. For video that is the number of *kept* frames once
  // adaptive sampling runs; the observed frame count lives in `SamplingReport.observed`.
  uint64 samples = 2;
  uint64 bytes = 3;
  // -1 means the track never reported a presentation timestamp; never a fabricated zero.
  int64 first_pts_ms = 4;
  // Exclusive end of the last decoded interval on this track; -1 when it could not be
  // observed. Adaptive sampling shortens the handoff, never this value.
  int64 last_end_ms = 5;
  uint32 width = 6;
  uint32 height = 7;
  string pixel_format = 8;
  uint32 sample_rate = 9;
  uint32 channels = 10;
  string audio_format = 11;
  // Frames this track refused. Sampler skips are included here (with their reason in
  // `drop_reasons`), so `samples + dropped_samples` stays the number of decoded samples.
  // The sampling breakdown is a different view of the same skips: never add the two.
  uint64 dropped_samples = 12;
  repeated string drop_reasons = 13;
  // Presentation origin applied to the raw media timestamps, in milliseconds. Non-zero means
  // the container declared an edit list and the descriptor timeline was shifted onto it.
  int64 timeline_offset_ms = 14;
  // Buffers whose interval repeats the previous one, which millisecond rounding can produce at
  // the end of a stream. They are kept, never deleted, and always counted here.
  uint64 overlapping_samples = 15;
  // Handed-off samples whose duration was not carried by the buffer and was derived from the
  // measured PTS gap to the next sample on the same track. Zero means every handed-off sample
  // carried its own duration; it is never a claim that timing metadata was present.
  uint64 duration_derived_samples = 16;
  // GStreamer element that actually decoded this track (`vtdec_hw`, `avdec_h264`, ...). The
  // element is negotiated per host, so "this format works here" cannot be checked without it.
  // Empty means the run could not attribute a decoder, never "the built-in one".
  // `demuxer_passthrough` is a settled answer, not an empty one: the container stores raw
  // samples (PCM in MOV), so there is no parser/decoder element to attribute at all.
  string decoder_element = 17;
  // Source format context this track was admitted under (ADR-009), as observed before decoding.
  // Empty or unset means the value was not collected; it is never a default that hides a
  // rejection.
  string source_codec = 18;
  optional uint32 source_bit_depth = 19;
  string source_chroma_format = 20;
  // Container-declared colorimetry string (`bt709`, `bt2020`, ...), verbatim from caps.
  string colorimetry = 21;
  // Rotation actually applied during normalization. Unset means "not determined", so a reader
  // cannot assume the frame is upright.
  optional uint32 applied_rotation_deg = 22;
  // CONSTANT | VARIABLE | UNKNOWN, decided from the declared frame rate against the measured
  // PTS deltas. UNKNOWN must not be treated as constant.
  FrameRateMode frame_rate_mode = 23;
  // Frame rate declared by the source caps. Both zero means not declared.
  uint32 declared_frame_rate_num = 24;
  uint32 declared_frame_rate_den = 25;
}

// Whether the source declared a constant frame rate and the decoder agreed.
enum FrameRateMode {
  FRAME_RATE_MODE_UNKNOWN = 0;
  FRAME_RATE_MODE_CONSTANT = 1;
  FRAME_RATE_MODE_VARIABLE = 2;
}

// A track that was found in the source and refused admission (ADR-009), with the stable reason.
// Refused tracks must be listed here: a report that only omits them reads as "the source had no
// such track", which is the silent behaviour ADR-009 forbids.
message RejectedTrack {
  string track_kind = 1; // video | audio | other
  // Stable code, never free text: unsupported_container_avi, unsupported_bit_depth_10bit, ...
  string code = 2;
  // The observed value the code refers to (`video/x-msvideo`, `10`, `6`), sanitized, not media.
  string detail = 3;
  // Container caps name when it was collected; empty means unknown.
  string container = 4;
  // Decoder element that would have handled this track, when one was negotiated.
  string decoder_element = 5;
}

// One audio segment cut from decoded PCM. The range covers exactly the samples it carries,
// so a segment is never wider than its own payload.
message AudioSegment {
  string segment_id = 1;
  edge.material.common.v1.TimeRange time_range = 2;
  uint32 sample_rate = 3;
  uint32 channels = 4;
  uint64 bytes = 5;
  // True when the segment is shorter than the configured length because the stream ended.
  bool partial = 6;
  // Interleaved sample layout of the bytes this segment carries; mirrors BufferFormat.
  string sample_format = 7;
}

message AudioSegmentReport {
  uint32 segment_ms = 1;
  uint64 segments = 2;
  uint64 partial_segments = 3;
  uint64 bytes = 4;
  // Bounded preview; `listed_limit` below says how many segments were repeated here.
  repeated AudioSegment listed = 5;
  uint32 listed_limit = 6;
  // Samples the segmenter itself could not place, plus the holes that closed a segment.
  uint64 dropped_samples = 7;
  uint64 discontinuities = 8;
  repeated string drop_reasons = 9;
  // 相邻音频段实际重叠的毫秒数。0 表示明确不重叠，不得由读取方猜测。
  uint32 overlap_ms = 10;
}

// Adaptive sampling accounting for a video track. Every observed frame is counted exactly
// once, either as a keep (with a reason) or as a skip (with a reason). Keep count is bounded
// by the rate limit, never by luck.
message SamplingReport {
  string track_kind = 1; // video; only video is sampled
  int64 min_interval_ms = 2;
  int64 static_hold_ms = 3;
  uint32 change_threshold = 4;
  // Frames offered to the sampler (usable pts and complete layout). Frames rejected earlier
  // are counted on the track only, never here.
  uint64 observed = 5;
  uint64 kept = 6;
  uint64 kept_first_frame = 7;
  uint64 kept_content_change = 8;
  uint64 kept_static_heartbeat = 9;
  uint64 skipped_rate_limited = 10;
  uint64 skipped_no_change = 11;
  uint64 skipped_non_monotonic = 12;
  uint64 skipped_missing_signature = 13;
  // Longest gap between two keeps; a static stream is bounded by static_hold_ms.
  int64 max_gap_ms = 14;
  // Hard upper bound on keeps given the observed span, derived from the rate limit alone.
  uint64 max_keeps_bound = 15;
  // Largest observed gap between consecutive pts, used to recompute the max_gap_ms bound.
  int64 max_frame_interval_ms = 16;
  // Frames the sampler would have kept but suppressed because the downstream bounded queue was
  // under backpressure. They are counted in `observed` and in the track's `dropped_samples`
  // with the reason `backpressure_throttled`; this counter is that same suppression, seen from
  // the sampling side. It is never a silent drop and never a success.
  uint64 skipped_backpressure_throttled = 17;
}

// Real data-plane accounting for one replay. All zeros means this build never decoded.
message DecodedDataPlane {
  string arena_id = 1;
  uint64 arena_capacity_bytes = 2;
  // High-water mark of committed arena space, not concurrent live bytes: the arena is a bump
  // allocator with a free list, so a request too large for any freed region commits new space.
  // A value near `arena_capacity_bytes` means the stream is fragmenting the arena.
  uint64 arena_peak_bytes = 3;
  // Cumulative bytes that flowed through the arena. Not resident, and not a memory bound.
  uint64 decoded_bytes = 4;
  repeated DecodedTrackStat tracks = 5;
  uint64 descriptors_built = 6;
  uint64 descriptors_validated = 7;
  uint64 descriptor_failures = 8;
  repeated string failure_reasons = 9;
  uint64 leases_issued = 10;
  uint64 leases_released = 11;
  // First descriptor verified for each track: handoff-contract evidence, still without bytes.
  repeated edge.material.common.v1.BufferDescriptor evidence_descriptors = 12;
  AudioSegmentReport audio_segments = 13;
  // Sampling accounting when this build really decoded. Empty means no sampling ran here;
  // it must never be read as "every frame was kept".
  repeated SamplingReport sampling = 14;
  // Backpressure accounting for the bounded queue that sits after the descriptor. `observed`
  // distinguishes "this run measured the queue and saw no pressure" from "this run had no such
  // queue"; a zero here must never be read as proof that nothing was dropped.
  BackpressureReport backpressure = 15;
  // Tracks the source contained but ADR-009 refused. They produce no descriptor and no track
  // stat: this list is the only place they exist, and it is required.
  repeated RejectedTrack rejected_tracks = 16;
}

// One bounded queue's water marks. `capacity` and `peak` are always counts of the same unit
// (`depth` counts items, `bytes` counts bytes), so a peak above capacity is a bug, not a spike.
message BackpressureQueue {
  string name = 1; // handoff_retained_table | handoff_retained_kind | handoff_arena_bytes
  // handoff_retained_kind is the deepest single buffer kind, bounded by
  // retained_kind_limit = max(1, retained_limit / 2), so one kind cannot take the whole window.
  string unit = 2; // items | bytes
  uint64 capacity = 3;
  uint64 current = 4;
  // High-water mark over the whole run. It is the largest value actually reached, not an
  // estimate and not a configured limit.
  uint64 peak = 5;
}

// Why a bounded queue refused work, and how much. A refusal is always counted with a reason:
// the queue is bounded on purpose, so this table is evidence of correct behaviour, not a fault.
message BackpressureDropReason {
  string reason = 1;
  uint64 count = 2;
}

// What kind of buffer was refused. The bounded queue is shared by every kind on the stream
// (video frames and audio PCM segment the same retained table), so a bare total cannot be read
// as "video frames were dropped": this breakdown is what makes the total interpretable.
message BackpressureDropKind {
  // video_frame | audio_pcm | audio_segment, the same kind strings the descriptors carry.
  string kind = 1;
  uint64 count = 2;
}

// Backpressure observability for the bounded queue after the descriptor.
//
// Accounting identities that a reader may rely on:
//   dropped_total = sum(drop_reasons[].count)                     (every drop is explained)
// Residency describes how long a retained buffer waited for its consumer; it is measured only
// for buffers that ended (released or expired), so `residency_samples` is the sample count of
// the statistic and can legitimately be smaller than `sampled_total`.
message BackpressureReport {
  // False means this run had no bounded post-descriptor queue to measure, for example a
  // time-based replay that never exposed a data plane. Every other field is then meaningless
  // and must not be read as zero pressure.
  bool observed = 1;
  repeated BackpressureQueue queues = 2;
  // ok | degraded | saturated. Derived from the queue depth against the policy thresholds,
  // never from a health check.
  string state = 3;
  // How many times the run entered `degraded` and `saturated`. `state` is where it ended.
  uint64 degraded_entries = 4;
  uint64 saturated_entries = 5;
  // Refusals by the bounded queue, with their reasons.
  uint64 dropped_total = 6;
  repeated BackpressureDropReason drop_reasons = 7;
  // Buffers whose consumer never released them inside the lease TTL and that the runtime had to
  // reclaim. A timeout is a real measured event, not a missing sample.
  uint64 timeouts_total = 8;
  // Wait time between retaining a buffer and its release or expiry, in milliseconds.
  uint64 residency_samples = 9;
  uint64 residency_max_ms = 10;
  uint64 residency_avg_ms = 11;
  // Stage-1 degradation actually applied: keeps the sampler gave up because of backpressure.
  uint64 sampling_throttled_samples = 12;
  // The throttle factor applied to the sampling rate limit while the queue was not `ok`.
  uint64 throttle_factor = 13;
  // Refusals by buffer kind. `sum(drop_kinds[].count) == dropped_total` holds for the same
  // reasons `drop_reasons` does.
  repeated BackpressureDropKind drop_kinds = 14;
}

// Residency policy (ADR-015 / ADR-019) applied to one run's bounded post-descriptor queue.
//
// The tier caps the declaration, it never rewrites it: a pipeline whose `queue_capacity` (or
// whose retained window) exceeds the injected cap fails before a report is written, so a value
// that would have been clipped does not appear here as `admitted`.
message MediaQueueAdmission {
  // not_injected | admitted. `not_injected` means the host tier was absent, which is a fact
  // about this run, not a zero limit.
  string state = 1;
  // Tier name from SENSORYPLEX_RESIDENT_TIER; empty when the tier was not injected.
  string tier = 2;
  // `queue_capacity` exactly as the pipeline file declares it. Never a normalized value.
  uint64 declared_capacity = 3;
  // SENSORYPLEX_MEDIA_QUEUE_CAPACITY as injected; 0 means not injected, never an assumed limit.
  uint64 tier_capacity = 4;
  // Depth of the retained window this run really used (`--handoff-retained-limit`, else the
  // built-in default). This is the queue `BackpressureReport` measures.
  uint64 retained_limit = 5;
}

// One replay attempt. Counters and reasons stay explicit instead of optimistic defaults.
message ReplayReport {
  MediaSourceDescription source = 1;
  repeated TimelineAnchor anchors = 2;
  uint64 decoded_items = 3;
  uint64 emitted_anchors = 4;
  uint64 dropped_items = 5;
  uint64 out_of_order_items = 6;
  uint64 gap_items = 7;
  string platform = 8;
  // Capabilities this build did not implement, for example gstreamer_decode_not_implemented.
  repeated string blockers = 9;
  // Why items were dropped. A drop is always explained, never silent.
  repeated string drop_reasons = 10;
  // Stays false unless real authorized media passed the full acceptance path.
  bool golden_path_verified = 11;
  // Populated only when this build actually decoded buffers.
  DecodedDataPlane decoded = 12;
  // Whether this run handed the decoded bytes to an independent consumer process.
  // A plain replay must report "not_exercised": a report must never imply that the
  // lease consumer ran. "exposed_on=<addr>" means the data plane was served there,
  // and the lease accounting lives in that run's `handoff_stats` line.
  string handoff_state = 13;
  // Host-tier admission of this run's post-descriptor queue (ADR-019).
  MediaQueueAdmission media_queue = 14;
}
