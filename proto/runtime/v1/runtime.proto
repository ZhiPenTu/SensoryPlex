syntax = "proto3";
package edge.material.runtime.v1;

import "common/v1/common.proto";
import "material/v1/material.proto";
import "google/protobuf/struct.proto";

service ProcessorPluginService {
  rpc Describe(DescribeRequest) returns (PluginDescription);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidationResult);
  rpc Start(StartRequest) returns (LifecycleResponse);
  rpc Process(ProcessRequest) returns (ProcessResponse);
  rpc Cancel(CancelRequest) returns (LifecycleResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Drain(DrainRequest) returns (LifecycleResponse);
  rpc Stop(StopRequest) returns (LifecycleResponse);
}

message DescribeRequest {}
message PluginDescription {
  string name = 1;
  string version = 2;
  string protocol = 3;
  repeated string consumes = 4;
  repeated string produces = 5;
  repeated string memory_kinds = 6;
}
message ValidateConfigRequest { google.protobuf.Struct config = 1; }
message ValidationResult { bool valid = 1; repeated string field_errors = 2; }
message StartRequest { google.protobuf.Struct config = 1; }
message LifecycleResponse { string state = 1; edge.material.common.v1.ProcessingError error = 2; }
message PluginInput {
  oneof value {
    edge.material.common.v1.BufferDescriptor buffer = 1;
    edge.material.material.v1.Observation observation = 2;
  }
}
message ProcessRequest {
  edge.material.common.v1.RequestContext context = 1;
  repeated PluginInput inputs = 2;
  string processor_release_id = 3;
}
message ProcessResponse {
  repeated edge.material.material.v1.Observation observations = 1;
  repeated string warnings = 2;
  edge.material.common.v1.ProcessingError error = 3;
}
message CancelRequest { string request_id = 1; }
message HealthRequest {}
message HealthResponse { string state = 1; repeated string unavailable_capabilities = 2; }
message DrainRequest { uint32 grace_period_ms = 1; }
message StopRequest {}

// Host facts reported by the platform itself. Zero means unknown, never "not applicable".
message HostResources {
  // Bytes shared by CPU/GPU/accelerator. Zero when the platform has no unified memory.
  uint64 unified_memory_bytes = 1;
  uint64 total_memory_bytes = 2;
  uint32 logical_cores = 3;
}

enum CapabilityState {
  CAPABILITY_STATE_UNSPECIFIED = 0;
  CAPABILITY_STATE_AVAILABLE = 1;
  CAPABILITY_STATE_UNAVAILABLE = 2;
}

// One execution backend on this host. An unavailable backend must state a reason.
message BackendCapability {
  string backend = 1;
  string platform = 2;
  // Empty when the backend cannot report its runtime version, never a guessed value.
  string runtime_version = 3;
  repeated string precisions = 4;
  repeated string memory_kinds = 5;
  uint32 max_concurrency = 6;
  CapabilityState state = 7;
  string unavailable_reason = 8;
}

// How a *host* accelerator probe ended. "The probe could not tell" is a third answer and must
// never be collapsed into "unavailable".
enum AcceleratorState {
  ACCELERATOR_STATE_UNSPECIFIED = 0;
  ACCELERATOR_STATE_AVAILABLE = 1;
  ACCELERATOR_STATE_UNAVAILABLE = 2;
  ACCELERATOR_STATE_UNKNOWN = 3;
}

// Host-side accelerator facts, probed independently of `backends` (ADR-022).
//
// `backends` answers "can *this process* execute model inference?"; this message answers
// "does *this host* have the accelerator?". Collapsing the two would either claim acceleration
// this runtime does not use, or hide an accelerator the host does have. An accelerator reported
// available here is therefore never a claim that this process executes on it: nothing in the
// runtime executes inference, and that fact stays visible in `unavailable_capabilities`.
message HostAccelerator {
  // Stable name: coreml | metal | cuda | tensorrt.
  string accelerator = 1;
  string platform = 2;
  AcceleratorState state = 3;
  // Which probe produced this line: system_profiler | framework_info | nvidia_smi | unavailable.
  // Probes read the host itself; nothing here is inferred from a config file.
  string detection_source = 4;
  // Read back from the host by the probe. Empty means the probe could not learn it, never a guess.
  string runtime_version = 5;
  // Bounded, controlled facts the decision was made from, for example
  // spdisplays_mtlgpufamilysupport=metal4 or cf_bundle_version=3520.5.1.
  // Never a filesystem path and never unbounded tool output.
  repeated string evidence = 6;
  // Stable reason; required whenever state != ACCELERATOR_STATE_AVAILABLE.
  string unavailable_reason = 7;
}

// Residency limits carried by this process from the host tier (ADR-015 / ADR-019).
//
// This endpoint only *carries* them: `serve` runs no pipeline, so it has no queue to bound.
// Enforcing `media_queue_capacity` happens in the media paths, and those runs report it in
// `ReplayReport.media_queue`. Reporting an injected number here must therefore never be read
// as "this endpoint already applies it".
message ResidencyLimits {
  // Tier name from SENSORYPLEX_RESIDENT_TIER; empty when no tier was injected.
  string tier = 1;
  // SENSORYPLEX_MEDIA_QUEUE_CAPACITY; 0 means not injected.
  uint64 media_queue_capacity = 2;
  // SENSORYPLEX_MODEL_PARALLELISM; 0 means not injected. No worker reads it yet, so it stays a
  // declared budget and never a measured concurrency.
  uint64 model_parallelism = 3;
}

message DescribeCapabilitiesRequest {}
message DescribeCapabilitiesResponse {
  // Build target of the running runtime, for example macos-aarch64 or linux-x86_64.
  string platform = 1;
  HostResources host = 2;
  repeated BackendCapability backends = 3;
  repeated string unavailable_capabilities = 4;
  // Memory kinds the runtime admits on this platform; media admission must not exceed it.
  repeated string admitted_memory_kinds = 5;
  // Host accelerator facts (ADR-022). Present on every target that expects an accelerator; each
  // entry states how it was probed, and is never read as "this process uses it".
  repeated HostAccelerator host_accelerators = 7;
  // Host tier limits this process was started with (ADR-015). Always present; an absent tier
  // is reported by an empty `tier` and zero limits, never by omitting the message.
  ResidencyLimits residency = 6;
}

service RuntimeService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc DescribeCapabilities(DescribeCapabilitiesRequest) returns (DescribeCapabilitiesResponse);
}
