syntax = "proto3";
package edge.material.orchestration.v1;

import "google/protobuf/struct.proto";

// The authoritative, immutable identity of a plugin used by a published pipeline revision.
message PluginReference {
  string plugin_id = 1;
  string version = 2;
  string artifact_digest = 3;
  string config_hash = 4;
}

enum PipelineRunState {
  PIPELINE_RUN_STATE_UNSPECIFIED = 0;
  PIPELINE_RUN_STATE_ACCEPTED = 1;
  PIPELINE_RUN_STATE_VALIDATING = 2;
  PIPELINE_RUN_STATE_QUEUED = 3;
  PIPELINE_RUN_STATE_RUNNING = 4;
  PIPELINE_RUN_STATE_SUCCEEDED = 5;
  PIPELINE_RUN_STATE_FAILED = 6;
  PIPELINE_RUN_STATE_CANCELLED = 7;
  PIPELINE_RUN_STATE_EXPIRED = 8;
}

enum PipelineTaskState {
  PIPELINE_TASK_STATE_UNSPECIFIED = 0;
  PIPELINE_TASK_STATE_PENDING = 1;
  PIPELINE_TASK_STATE_READY = 2;
  PIPELINE_TASK_STATE_ASSIGNED = 3;
  PIPELINE_TASK_STATE_RUNNING = 4;
  PIPELINE_TASK_STATE_RETRY_WAIT = 5;
  PIPELINE_TASK_STATE_SUCCEEDED = 6;
  PIPELINE_TASK_STATE_FAILED = 7;
  PIPELINE_TASK_STATE_CANCELLED = 8;
  PIPELINE_TASK_STATE_BLOCKED = 9;
}

message PipelineNode {
  string node_id = 1;
  PluginReference plugin = 2;
  repeated string consumes = 3;
  repeated string produces = 4;
  string placement = 5;
  uint32 deadline_ms = 6;
  uint32 max_attempts = 7;
  uint32 priority = 8;
  // false 表示慢路径 enrichment；失败必须可见，但不阻断已完成的必需快路径。
  bool required = 9;
}

message PipelineEdge {
  string from_node_id = 1;
  string to_node_id = 2;
  string modality = 3;
  string join_policy = 4;
  bool required = 5;
}

message PipelineRevision {
  string pipeline_id = 1;
  uint64 revision = 2;
  string graph_digest = 3;
  repeated PipelineNode nodes = 4;
  repeated PipelineEdge edges = 5;
}

message PipelineRun {
  string run_id = 1;
  string pipeline_id = 2;
  uint64 revision = 3;
  string input_ref = 4;
  string idempotency_key = 5;
  int64 deadline_unix_ms = 6;
  PipelineRunState state = 7;
  string owner = 8;
  string error_code = 9;
  string error_detail = 10;
  int64 created_at_unix_ms = 11;
  int64 updated_at_unix_ms = 12;
  int64 completed_at_unix_ms = 13;
}

message PipelineTask {
  string task_id = 1;
  string run_id = 2;
  string node_id = 3;
  uint32 attempt = 4;
  string idempotency_key = 5;
  PipelineTaskState state = 6;
  string assignment_id = 7;
  string reason_code = 8;
  uint32 max_attempts = 9;
  string error_detail = 10;
  string output_ref = 11;
  int64 created_at_unix_ms = 12;
  int64 updated_at_unix_ms = 13;
  bool required = 14;
}

message SchedulerAssignment {
  string assignment_id = 1;
  string task_id = 2;
  string requested_node_id = 3;
  string actual_node_id = 4;
  string data_plane_node_id = 5;
  string decision = 6;
  string reason_code = 7;
  int64 lease_expires_at_unix_ms = 8;
  string run_id = 9;
  uint32 attempt = 10;
  int64 created_at_unix_ms = 11;
}

// 执行器领取的受控输入清单。它只引用本机数据面或已授权 Observation，绝不携带媒体字节、路径或密钥。
message TaskInputManifest {
  string run_id = 1;
  string task_id = 2;
  uint32 attempt = 3;
  string assignment_id = 4;
  string data_plane_node_id = 5;
  string descriptor_ref = 6;
  repeated string observation_refs = 7;
  string stream_id = 8;
  int64 start_ms = 9;
  int64 end_ms = 10;
  string content_hash = 11;
}

// 回执使“插件进程还活着”和“这个 assignment 已执行”成为两个不可混淆的事实。
message TaskExecutionReceipt {
  string run_id = 1;
  string task_id = 2;
  uint32 attempt = 3;
  string assignment_id = 4;
  PluginReference plugin = 5;
  int64 started_at_unix_ms = 6;
  int64 completed_at_unix_ms = 7;
  uint32 input_count = 8;
  uint32 output_count = 9;
  string result_manifest_ref = 10;
  string reason_code = 11;
  string receipt_digest = 12;
}

message ValidatePipelineRevisionRequest {
  string pipeline_id = 1;
  repeated PipelineNode nodes = 2;
  repeated PipelineEdge edges = 3;
}

message ValidatePipelineRevisionResponse {
  bool valid = 1;
  repeated string errors = 2;
  string graph_digest = 3;
}

message PublishPipelineRevisionRequest {
  string pipeline_id = 1;
  string name = 2;
  string description = 3;
  repeated PipelineNode nodes = 4;
  repeated PipelineEdge edges = 5;
}

message PublishPipelineRevisionResponse {
  PipelineRevision revision = 1;
}

message SubmitPipelineRunRequest {
  string pipeline_id = 1;
  uint64 revision = 2;
  string input_ref = 3;
  string idempotency_key = 4;
  int64 deadline_unix_ms = 5;
}

message SubmitPipelineRunResponse {
  PipelineRun run = 1;
  repeated PipelineTask tasks = 2;
  bool is_duplicate = 3;
}

message GetPipelineRunRequest {
  string run_id = 1;
}

message GetPipelineRunResponse {
  PipelineRun run = 1;
  repeated PipelineTask tasks = 2;
  repeated SchedulerAssignment assignments = 3;
}

message CancelPipelineRunRequest {
  string run_id = 1;
  string reason = 2;
}

message CancelPipelineRunResponse {
  PipelineRun run = 1;
  repeated PipelineTask cancelled_tasks = 2;
}

message RetryPipelineTaskRequest {
  string task_id = 1;
}

message RetryPipelineTaskResponse {
  PipelineTask task = 1;
}

message ClaimTaskRequest {
  string node_id = 1;
  repeated string supported_plugins = 2;
  uint32 max_tasks = 3;
}

message ClaimTaskResponse {
  repeated PipelineTask tasks = 1;
  repeated SchedulerAssignment assignments = 2;
}

message TaskResult {
  string task_id = 1;
  string run_id = 2;
  uint32 attempt = 3;
  string assignment_id = 4;
  bool success = 5;
  string output_ref = 6;
  bool retryable = 7;
  string reason_code = 8;
  string error_detail = 9;
  // output_ref 保留兼容；新调用应使用受校验的结果清单与回执。
  string result_manifest_ref = 10;
  TaskExecutionReceipt receipt = 11;
  google.protobuf.Struct result_summary = 12;
}

message ReportTaskResultRequest {
  TaskResult result = 1;
}

message ReportTaskResultResponse {
  PipelineTask task = 1;
  repeated string unlocked_task_ids = 2;
}

message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message CancelTaskResponse {
  PipelineTask task = 1;
}

service OrchestrationService {
  rpc ValidatePipeline(ValidatePipelineRevisionRequest) returns (ValidatePipelineRevisionResponse);
  rpc PublishPipeline(PublishPipelineRevisionRequest) returns (PublishPipelineRevisionResponse);
  rpc SubmitRun(SubmitPipelineRunRequest) returns (SubmitPipelineRunResponse);
  rpc GetRun(GetPipelineRunRequest) returns (GetPipelineRunResponse);
  rpc CancelRun(CancelPipelineRunRequest) returns (CancelPipelineRunResponse);
  rpc RetryTask(RetryPipelineTaskRequest) returns (RetryPipelineTaskResponse);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc ReportTaskResult(ReportTaskResultRequest) returns (ReportTaskResultResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}
