syntax = "proto3";
package edge.material.material.v1;

import "common/v1/common.proto";
import "google/protobuf/struct.proto";

enum ModelApplicability {
  MODEL_APPLICABILITY_UNSPECIFIED = 0;
  MODEL_APPLICABILITY_MODEL_BASED = 1;
  MODEL_APPLICABILITY_NOT_APPLICABLE = 2;
}

message Provenance {
  string plugin = 1;
  string plugin_version = 2;
  string artifact_digest = 3;
  string model_release_id = 4;
  string model_id = 5;
  string model_version = 6;
  string config_hash = 7;
  string execution_backend = 8;
  string model_artifact_digest = 9;
  string processor_release_id = 10;
  ModelApplicability model_applicability = 11;
}

message Observation {
  string observation_id = 1;
  string modality = 2;
  string stream_id = 3;
  string source_id = 4;
  string source_item_id = 5;
  edge.material.common.v1.TimeRange time_range = 6;
  google.protobuf.Struct payload = 7;
  optional double confidence = 8;
  string confidence_unavailable_reason = 9;
  string quality_state = 10;
  repeated string quality_reasons = 11;
  Provenance provenance = 12;
  string content_hash = 13;
  int64 created_at_unix_ms = 14;
  string timing_source = 15;
  optional double timing_confidence = 16;
  string schema_id = 17;
  string schema_version = 18;
  string schema_digest = 19;
}

message SourceReference {
  string asset_id = 1;
  edge.material.common.v1.TimeRange time_range = 2;
  string content_hash = 3;
}

message MaterialUnit {
  string material_unit_id = 1;
  string stream_id = 2;
  edge.material.common.v1.TimeRange time_range = 3;
  // A source-backed second may be partial with no observations only when
  // pending_enrichments is non-empty. It never implies model success.
  string status = 4;
  uint32 revision = 5;
  repeated Observation observations = 6;
  repeated string tags = 7;
  repeated SourceReference source_refs = 8;
  string pipeline_version = 9;
  repeated string pending_enrichments = 10;
  int64 created_at_unix_ms = 11;
  bool superseded = 12;
  optional uint32 prev_revision = 13;
}
