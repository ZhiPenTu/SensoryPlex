syntax = "proto3";
package edge.material.node.v1;

import "runtime/v1/runtime.proto";
import "google/protobuf/struct.proto";

// Node status lifecycle in ADR-026.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_CANDIDATE = 1;
  NODE_STATUS_ENROLLING = 2;
  NODE_STATUS_READY = 3;
  NODE_STATUS_DRAINING = 4;
  NODE_STATUS_OFFLINE = 5;
  NODE_STATUS_REVOKED = 6;
}

// Plugin instance lifecycle states in ADR-026.
enum PluginInstanceState {
  PLUGIN_INSTANCE_STATE_UNSPECIFIED = 0;
  PLUGIN_INSTANCE_STATE_PLANNED = 1;
  PLUGIN_INSTANCE_STATE_INSTALLING = 2;
  PLUGIN_INSTANCE_STATE_READY = 3;
  PLUGIN_INSTANCE_STATE_DEGRADED = 4;
  PLUGIN_INSTANCE_STATE_DRAINING = 5;
  PLUGIN_INSTANCE_STATE_STOPPED = 6;
  PLUGIN_INSTANCE_STATE_FAILED = 7;
  PLUGIN_INSTANCE_STATE_ROLLED_BACK = 8;
  PLUGIN_INSTANCE_STATE_UNINSTALLED = 9;
}

// Deployment action from main node to node agent.
enum DeploymentAction {
  DEPLOYMENT_ACTION_UNSPECIFIED = 0;
  DEPLOYMENT_ACTION_INSTALL = 1;
  DEPLOYMENT_ACTION_START = 2;
  DEPLOYMENT_ACTION_STOP = 3;
  DEPLOYMENT_ACTION_UNINSTALL = 4;
  DEPLOYMENT_ACTION_ROLLBACK = 5;
  DEPLOYMENT_ACTION_DRAIN = 6;
  DEPLOYMENT_ACTION_TASK_PROCESS = 7;
  // 热部署（ADR-030）：下载/校验/离线安装受控 bundle，作为 candidate 启动并完成验证。
  DEPLOYMENT_ACTION_STAGE_RELEASE = 8;
  // 要求 Agent 用平台服务真实状态、endpoint 与控制面 generation 对账后回报。
  DEPLOYMENT_ACTION_RECONCILE = 9;
}

// 部署操作阶段（ADR-030）。前四段由 Agent 回报推进，其余由控制面推进。
enum PluginOperationStage {
  PLUGIN_OPERATION_STAGE_UNSPECIFIED = 0;
  PLUGIN_OPERATION_STAGE_ACCEPTED = 1;
  PLUGIN_OPERATION_STAGE_STAGING = 2;
  PLUGIN_OPERATION_STAGE_STARTING = 3;
  PLUGIN_OPERATION_STAGE_VALIDATING = 4;
  PLUGIN_OPERATION_STAGE_CANDIDATE_READY = 5;
  PLUGIN_OPERATION_STAGE_CUTTING_OVER = 6;
  PLUGIN_OPERATION_STAGE_DRAINING_OLD = 7;
  PLUGIN_OPERATION_STAGE_SUCCEEDED = 8;
  PLUGIN_OPERATION_STAGE_FAILED = 9;
  PLUGIN_OPERATION_STAGE_CANCELLED = 10;
}

// 版本化运行实例在槽位中的角色与状态（ADR-030）。
enum PluginRuntimeRole {
  PLUGIN_RUNTIME_ROLE_UNSPECIFIED = 0;
  PLUGIN_RUNTIME_ROLE_CANDIDATE = 1;
  PLUGIN_RUNTIME_ROLE_ACTIVE = 2;
  PLUGIN_RUNTIME_ROLE_PREVIOUS = 3;
  PLUGIN_RUNTIME_ROLE_FAILED = 4;
}

enum PluginRuntimeState {
  PLUGIN_RUNTIME_STATE_UNSPECIFIED = 0;
  PLUGIN_RUNTIME_STATE_PLANNED = 1;
  PLUGIN_RUNTIME_STATE_STAGED = 2;
  PLUGIN_RUNTIME_STATE_STARTING = 3;
  PLUGIN_RUNTIME_STATE_VALIDATING = 4;
  PLUGIN_RUNTIME_STATE_CANDIDATE_READY = 5;
  PLUGIN_RUNTIME_STATE_ACTIVE = 6;
  PLUGIN_RUNTIME_STATE_DRAINING = 7;
  PLUGIN_RUNTIME_STATE_STOPPED = 8;
  PLUGIN_RUNTIME_STATE_FAILED = 9;
  PLUGIN_RUNTIME_STATE_UNINSTALLED = 10;
}

// Capabilities and resources of a node.
message NodeCapabilityProfile {
  string platform = 1; // macos, linux
  string arch = 2;     // aarch64, x86_64
  uint32 cpu_cores = 3;
  uint64 memory_bytes = 4;
  uint64 unified_memory_bytes = 5;
  repeated edge.material.runtime.v1.HostAccelerator accelerators = 6;
  repeated string supported_artifacts = 7; // local_native, container
  map<string, string> labels = 8;
}

// Registered node snapshot in the control plane registry.
message NodeInfo {
  string node_id = 1;
  string display_name = 2;
  NodeStatus status = 3;
  string status_reason = 4;
  NodeCapabilityProfile capabilities = 5;
  bool is_co_located = 6;
  string last_heartbeat_at = 7;
  string enrolled_at = 8;
  repeated PluginInstance instances = 9;
}

message NodeList {
  repeated NodeInfo items = 1;
  uint32 total = 2;
}

// Plugin instance tracking on a specific node.
message PluginInstance {
  string instance_id = 1;
  string node_id = 2;
  string plugin_id = 3;
  string plugin_version = 4;
  string artifact_digest = 5;
  string previous_digest = 6;
  string desired_state = 7;
  string actual_state = 8;
  string config_hash = 9;
  google.protobuf.Struct config = 10;
  string error_code = 11;
  string error_detail = 12;
  string created_at = 13;
  string updated_at = 14;
  // 槽位 active 指针与 fencing 世代（ADR-030）。Scheduler 只解析 active endpoint。
  string active_runtime_instance_id = 15;
  string active_release_id = 16;
  string previous_runtime_instance_id = 17;
  uint64 generation = 18;
  string endpoint = 19;
}

message PluginInstanceList {
  repeated PluginInstance items = 1;
  uint32 total = 2;
}

// Enrollment token for sub-node agent authentication.
message EnrollmentToken {
  string token = 1;
  string node_id = 2;
  string expires_at = 3;
  string created_at = 4;
}

message CreateEnrollmentTokenRequest {
  string node_id = 1;
  uint32 expires_in_minutes = 2;
}

message EnrollNodeRequest {
  string enrollment_token = 1;
  string node_id = 2;
  string display_name = 3;
  bool is_co_located = 4;
  NodeCapabilityProfile capabilities = 5;
}

message EnrollNodeResponse {
  bool success = 1;
  string node_id = 2;
  NodeStatus status = 3;
  string session_token = 4;
  string message = 5;
}

message NodeHeartbeatRequest {
  string node_id = 1;
  string session_token = 2;
  int64 timestamp_unix_ms = 3;
  uint64 available_memory_bytes = 4;
  uint32 current_concurrency = 5;
  repeated string running_instance_ids = 6;
  // Agent 用自己的平台服务实际状态与控制面 generation 对账后的观测（ADR-030）。
  repeated PluginRuntimeObservation runtime_observations = 7;
}

// Agent 侧真实观测到的运行实例事实；未知状态必须如实上报，不得猜测成功。
message PluginRuntimeObservation {
  string runtime_instance_id = 1;
  string operation_id = 2;
  uint64 generation = 3;
  string observed_state = 4;
  string endpoint = 5;
  string supervisor_id = 6;
  bool supervisor_managed = 7;
  bool unit_loaded = 8;
  int32 last_exit_code = 9;
  string observed_at = 10;
  string reconciliation = 11; // matched, mismatch, unknown
  string detail = 12;
}

message NodeHeartbeatResponse {
  NodeStatus status = 1;
  uint32 heartbeat_interval_ms = 2;
  repeated DeploymentIntent pending_intents = 3;
  // 对账结果：状态与控制面世代不符的运行实例。控制面不猜、不删制品，只如实回报。
  repeated string reconciliation_required = 4;
}

message DeploymentIntent {
  string intent_id = 1;
  string instance_id = 2;
  string node_id = 3;
  string plugin_id = 4;
  string plugin_version = 5;
  DeploymentAction action = 6;
  string artifact_digest = 7;
  string rollback_digest = 8;
  google.protobuf.Struct config = 9;
  string created_at = 10;
  int64 deadline_unix_ms = 11;
  // 热部署字段（ADR-030）。Agent 只按 release_id 从受认证端点取 bundle；
  // 意图内不携带任意 URL、命令、宿主路径或密钥。
  string operation_id = 12;
  uint64 generation = 13;
  string release_id = 14;
  string bundle_digest = 15;
  string runtime_instance_id = 16;
  // 排空旧实例的受限 grace period（毫秒）；endpoint 文件路径由 Agent 从自己的
  // 版本化实例目录推导，**意图内不携带任何宿主路径**。
  int64 grace_period_ms = 17;
  // 配置身份由控制面基于原始 JSON 锁定。google.protobuf.Struct 在 JSON 往返时会
  // 规范化数字或省略 null，Agent 不得从 config 字段重新计算它。
  string config_hash = 18;
}

message ReportDeploymentRequest {
  string intent_id = 1;
  string instance_id = 2;
  string node_id = 3;
  DeploymentAction action = 4;
  bool success = 5;
  string actual_state = 6;
  string error_code = 7;
  string error_detail = 8;
  // 回报必须携带意图上的 operation/generation，供控制面拒绝过期、重复与旧世代回报。
  string operation_id = 9;
  uint64 generation = 10;
  string release_id = 11;
  string runtime_instance_id = 12;
  PluginOperationStage stage = 13;
  // 验证后的插件身份：必须是进程自己核对的真实值，不是意图回显。
  string verified_plugin_id = 14;
  string verified_artifact_digest = 15;
  // loopback endpoint 与平台服务标识（macOS LaunchAgent label / Linux systemd user unit）。
  string endpoint = 16;
  string supervisor_id = 17;
  uint64 staging_ms = 18;
  uint64 starting_ms = 19;
  uint64 validating_ms = 20;
  uint64 draining_ms = 21;
}

message PreflightRequest {
  string node_id = 1;
  string plugin_id = 2;
  string config_id = 3;
  bool requires_data_locality = 4;
  string data_plane_node_id = 5;
  google.protobuf.Struct config = 6;
}

message PreflightResponse {
  bool eligible = 1;
  string reason_code = 2;
  string detail = 3;
  repeated string matched_capabilities = 4;
  repeated string missing_capabilities = 5;
}

message TaskAssignment {
  string assignment_id = 1;
  string job_id = 2;
  string target_node_id = 3;
  string actual_node_id = 4;
  string state = 5;
  string reassignment_reason = 6;
  bool data_locality_checked = 7;
  int64 deadline_unix_ms = 8;
  string created_at = 9;
}

message DeregisterNodeRequest {
  string node_id = 1;
  string session_token = 2;
  string reason = 3;
}

message DeregisterNodeResponse {
  bool success = 1;
  string node_id = 2;
  NodeStatus status = 3;
  string message = 4;
}

// ── 插件热部署：受控 release、版本化运行实例与部署操作（ADR-030） ─────────────

// 不可变的首方 release。只有 trust=first_party 且 authenticated 的 release 可被激活。
message PluginRelease {
  string release_id = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  string platform = 4;
  string arch = 5;
  string form = 6;
  string artifact_digest = 7;
  string bundle_digest = 8;
  string manifest_digest = 9;
  string config_schema_digest = 10;
  string sbom_digest = 11;
  uint64 bundle_bytes = 12;
  google.protobuf.Struct entrypoint = 13;
  google.protobuf.Struct runtime_requirements = 14;
  string trust = 15;
  bool authenticated = 16;
  string authentication_method = 17;
  string signature_status = 18;
  uint32 sbom_components = 19;
  uint64 declared_memory_bytes = 20;
  uint64 declared_cpu_millicores = 21;
  int64 default_deadline_ms = 22;
  string published_at = 23;
  string created_by = 24;
}

message PluginReleaseList {
  repeated PluginRelease items = 1;
  uint32 total = 2;
}

// 版本化运行实例：同一槽位下 candidate 与 active 可以并存。
message PluginRuntimeInstance {
  string runtime_instance_id = 1;
  string instance_id = 2;
  string node_id = 3;
  string plugin_id = 4;
  string release_id = 5;
  string artifact_digest = 6;
  string bundle_digest = 7;
  uint64 generation = 8;
  PluginRuntimeRole role = 9;
  PluginRuntimeState state = 10;
  string endpoint = 11;
  string supervisor_id = 12;
  string unit_name = 13;
  string install_dir = 14;
  string verified_plugin_id = 15;
  string verified_artifact_digest = 16;
  uint64 launch_ms = 17;
  uint64 drain_ms = 18;
  string error_code = 19;
  string error_detail = 20;
  string created_at = 21;
  string updated_at = 22;
}

message PluginDeploymentOperation {
  string operation_id = 1;
  string kind = 2; // provision, upgrade, rollback, retire
  string node_id = 3;
  string instance_id = 4;
  string plugin_id = 5;
  string release_id = 6;
  // 本次操作开始时在服务的实例（provision 为空）；操作结算后它就是被替换的一方，
  // 不随槽位后续切换而变化。
  string from_runtime_instance_id = 7;
  string candidate_runtime_instance_id = 8;
  string rollback_of_operation_id = 9;
  uint64 generation = 10;
  PluginOperationStage stage = 11;
  bool cancellable = 12;
  int64 deadline_unix_ms = 13;
  string error_code = 14;
  string error_detail = 15;
  uint64 staging_ms = 16;
  uint64 starting_ms = 17;
  uint64 validating_ms = 18;
  uint64 draining_ms = 19;
  google.protobuf.Struct config = 20;
  PluginRuntimeInstance candidate = 21;
  // 读取时槽位的 active 指针指向的运行实例：切换成功后即本次 candidate，
  // 切换前失败时仍是本次操作开始前在服务的旧实例（等于 from_runtime_instance_id）。
  // 本次操作"替换掉的实例"只由 from_runtime_instance_id 表达，不要从这里反推。
  PluginRuntimeInstance active = 22;
  // 槽位的上一版本运行实例（排空后留作已验证回滚版本）。
  PluginRuntimeInstance previous = 23;
  string created_by = 24;
  string created_at = 25;
  string updated_at = 26;
  string completed_at = 27;
}

message PluginDeploymentOperationList {
  repeated PluginDeploymentOperation items = 1;
  uint32 total = 2;
}

message CreatePluginDeploymentRequest {
  string release_id = 1;
  string config_id = 2;
  google.protobuf.Struct config = 3;
}

message BatchDeployPluginsRequest {
  // Empty selects the four first-party processing plugins.
  repeated string plugin_ids = 1;
}

message PluginDeploymentRejection {
  string plugin_id = 1;
  string reason = 2;
}

message BatchDeployPluginsResponse {
  string node_id = 1;
  // Accepted operations are not evidence of completed installation.
  repeated PluginDeploymentOperation operations = 2;
  repeated string already_ready = 3;
  repeated PluginDeploymentRejection rejected = 4;
}

// 制品仓同步：API 重新计算落盘 bundle 字节摘要后导入首方 release 描述符。
message SyncPluginReleasesRequest {
  bool dry_run = 1;
}

message SyncPluginReleasesResponse {
  // 导入/未变化的都是 release_id 字符串；调用方要完整描述符时走列表接口。
  // 这里刻意不回传 PluginRelease：同步响应只表达"这一轮发生了什么"。
  repeated string imported = 1;
  repeated string unchanged = 2;
  // 拒绝原因形如 "<仓库内相对路径>:<稳定错误码>"，不做成结构化字段以免契约随校验项漂移。
  repeated string rejected = 3;
  uint32 total = 4;
}

// Administrator-approved Ed25519 publishers. Revocation blocks new admission.
message PluginSigner {
  string signer_id = 1;
  string display_name = 2;
  string public_key = 3;
  string created_by = 4;
  string created_at = 5;
  string revoked_at = 6;
}
message PluginSignerList { repeated PluginSigner items = 1; }
message ApprovePluginSignerRequest {
  string display_name = 1;
  string public_key = 2;
}
