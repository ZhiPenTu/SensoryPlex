[workspace]
members = ["crates/sdk", "crates/runtime", "crates/media", "crates/timeline", "crates/storage", "crates/execution"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
sensoryplex-sdk = { path = "crates/sdk" }
sensoryplex-media = { path = "crates/media" }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
