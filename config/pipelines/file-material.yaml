apiVersion: edge.material/v1
kind: Pipeline
metadata:
  name: file-material-poc
spec:
  source:
    type: file
    uri_secret_ref: SOURCE_URI
  queue_capacity: 32
  data_egress: local_only
  processors:
    - type: adaptive_sampler
    - type: audio_segmenter
    - type: asr
      model: faster-whisper-large-v3
    - type: ocr
      model: paddleocr-v5
    - type: vlm
      model: qwen-vl-fast
    - type: timeline_fusion
    - type: embedding
      model: bge-m3
  slow_enrichment:
    - type: vlm
      model: qwen-vl-quality
  sinks:
    - type: blob_storage
    - type: metadata_store
    - type: vector_store
  # `timeline_fusion` 处理器的策略。声明了处理器就必须给出策略（ADR-028）：
  # Runtime 的 `timeline` 子命令按 window_ms 选窗，按模态集合判定素材 readiness。
  # window_ms 必须能容纳一条描述符窗口——跨窗观测会被显式拒绝，不会被裁剪。
  timeline_fusion:
    window_ms: 5000
    fast_modalities:
      - asr_segment
      - ocr_blocks
      - vision.scene_description
    enrichment_modalities: []
