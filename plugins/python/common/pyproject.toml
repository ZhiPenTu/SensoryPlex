[project]
name = "edge-material-sdk"
version = "0.1.0"
description = "SensoryPlex versioned Python plugin SDK"
requires-python = ">=3.12,<3.13"
dependencies = ["protobuf>=5.29,<6", "grpcio>=1.71,<1.72"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_material_sdk"]
