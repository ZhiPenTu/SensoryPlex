apiVersion: edge.material.plugin/v1
kind: ProcessorPlugin
metadata:
  name: org.sensoryplex.embed-bge-onnx
  version: 0.1.0
  displayName: 文本向量（本机 BGE / ONNX Runtime）
  vendor: SensoryPlex
  license: Apache-2.0
  description: 消费上游 ocr_blocks 观测里的文字，用本机 BGE 权重产出带维度、池化与归一化声明的 L2 归一化向量。
spec:
  sdk:
    runtime: ">=0.1.0 <0.2.0"
    protocol: v1
  entrypoint:
    transport: grpc
    command:
      - uv
      - run
      - --frozen
      - python
      - -m
      - edge_material_plugin_embed_bge_onnx
    port: 50074
  capabilities:
    consumes:
      - observation.ocr_blocks
    produces:
      - observation.text_embedding
    # 本插件不消费任何 buffer：它要的是上游事实，不是字节；数据面不会挂到它身上。
    acceptsMemoryKinds: []
    ordering: per_stream
    supports:
      batch: false
      cancellation: true
      retry: idempotent
  resources:
    # 实测常驻内存见 docs/verification.md 的 M8 BGE 一节；取上界加余量。
    cpu: "2"
    memory: 2Gi
    maxConcurrency: 1
    maxBatchSize: 8
    defaultDeadlineMs: 120000
  config:
    schema: config.schema.json
    secretRefs: []
  security:
    # 权重由运营预置在 model_dir；插件自己**从不**联网（也不下载权重）。
    network: none
    dataEgress: local_only
    filesystem:
      readOnly: true
      writablePaths: []
  artifacts:
    form: local_native
    image: local:plugins/python/processors/embed-bge-onnx
    digest: sha256:deeb0ccc920df22e28445c50286d538395fb2dc703c8c5e9d1014f1488d8bb60
    sbom: sbom.cdx.json
    signatureUnavailableReason: local_native_plugin_is_not_signed_in_v1
