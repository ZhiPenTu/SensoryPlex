[project]
name = "edge-material-plugin-embed-bge-onnx"
version = "0.1.0"
description = "SensoryPlex text embedding processor plugin (BGE small zh v1.5 via ONNX Runtime; optional CoreML execution provider)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edge-material-sdk",
  "grpcio>=1.71,<1.72",
  "numpy>=2",
  "onnxruntime>=1.23,<2",
  "tokenizers>=0.22,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_material_plugin_embed_bge_onnx"]
