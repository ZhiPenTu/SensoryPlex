[project]
name = "edge-material-plugin-asr-whisper-mlx"
version = "0.1.0"
description = "SensoryPlex ASR processor plugin (local MLX Whisper backend, Apple Silicon)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edge-material-sdk",
  "grpcio>=1.71,<1.72",
  "mlx-whisper>=0.4,<0.5",
  "numpy>=2",
  "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_material_plugin_asr_whisper_mlx"]
