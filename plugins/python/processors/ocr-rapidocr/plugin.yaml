apiVersion: edge.material.plugin/v1
kind: ProcessorPlugin
metadata:
  name: org.sensoryplex.ocr-rapidocr
  version: 0.1.0
  displayName: 画面文字识别（本机 PP-OCR / ONNX Runtime）
  vendor: SensoryPlex
  license: Apache-2.0
  description: 读取 Runtime 数据面里的真实视频帧，用随包携带的 PP-OCR ONNX 权重产出带帧像素坐标与来源的文字块。
spec:
  sdk:
    runtime: ">=0.1.0 <0.2.0"
    protocol: v1
  entrypoint:
    transport: grpc
    command:
      - uv
      - run
      - --frozen
      - python
      - -m
      - edge_material_plugin_ocr_rapidocr
    port: 50073
  capabilities:
    consumes:
      - media.video_frame
    produces:
      - observation.ocr_blocks
    acceptsMemoryKinds:
      - cpu_shared_memory
    ordering: per_stream
    supports:
      batch: false
      cancellation: true
      retry: idempotent
  resources:
    # 实测常驻内存：CPU provider 约 610 MiB，CoreML provider 约 2.4 GiB（见 ADR-016）；取上界加余量。
    cpu: "2"
    memory: 3Gi
    maxConcurrency: 1
    maxBatchSize: 4
    defaultDeadlineMs: 120000
  config:
    schema: config.schema.json
    secretRefs: []
  security:
    # 正常路径（随包权重或显式 model_dir）不联网。只有权重缺失或摘要与目录不匹配时，
    # 引擎才会向 RapidOCR 的模型目录站拉取，因此这里只放行这一个主机。
    network: allowlist
    allowedHosts:
      - www.modelscope.cn
    dataEgress: local_only
    filesystem:
      # 权重通过包内路径或 model_dir 读取；本版本不声明任何可写路径（不落缓存、不写盘）。
      readOnly: true
      writablePaths: []
  artifacts:
    form: local_native
    image: local:plugins/python/processors/ocr-rapidocr
    digest: sha256:008baa66a2e8baa9f8b7d4a410c94f2a17f1195680600a70546dcaf73b9736fc
    sbom: sbom.cdx.json
    signatureUnavailableReason: local_native_plugin_is_not_signed_in_v1
