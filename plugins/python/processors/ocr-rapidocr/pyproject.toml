[project]
name = "edge-material-plugin-ocr-rapidocr"
version = "0.1.1"
description = "SensoryPlex OCR processor plugin (local PP-OCR ONNX via RapidOCR; optional CoreML execution provider)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edge-material-sdk",
  "grpcio>=1.71,<1.72",
  "numpy>=2",
  "onnxruntime>=1.23,<2",
  "rapidocr>=3.9,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_material_plugin_ocr_rapidocr"]
