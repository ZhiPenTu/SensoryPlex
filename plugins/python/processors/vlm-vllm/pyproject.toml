[project]
name = "edge-material-plugin-vlm-vllm"
version = "0.1.0"
description = "SensoryPlex VLM scene-description processor plugin (remote vLLM OpenAI-compatible backend)"
requires-python = ">=3.12,<3.13"
dependencies = ["edge-material-sdk", "grpcio>=1.71,<1.72", "nats-py>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_material_plugin_vlm_vllm"]
