[project]
name = "edge-material-plugin-vlm-moondream"
version = "0.1.1"
description = "SensoryPlex VLM scene-description processor plugin (local ollama backend)"
requires-python = ">=3.12,<3.13"
dependencies = ["edge-material-sdk", "grpcio>=1.71,<1.72"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_material_plugin_vlm_moondream"]
